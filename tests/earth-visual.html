<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Earth release QA</title></head>
<body><div id="root"></div>
<script type="module">
// Development-only entry. Not referenced by index.html or included in production builds.
import React from 'react';
import { createRoot } from 'react-dom/client';
import { QueryClient, QueryClientProvider } from '@tanstack/react-query';
import { EarthViewport } from '/src/features/earth-engine/ui/EarthViewport.tsx';
import { CesiumEarthEngine } from '/src/features/earth-engine/core/CesiumEarthEngine.ts';
import { createSatelliteCatalog } from '/src/features/satellites/domain/satellite.ts';
import { useSatelliteSelectionStore } from '/src/features/satellites/model/selection.ts';
import { usePreferencesStore } from '/src/features/settings/model/preferences.ts';
import { i18n } from '/src/shared/i18n/i18n.ts';
import { Cartesian3, JulianDate, SceneTransforms } from 'cesium';
import '/src/styles/app.css';

const params = new URLSearchParams(location.search);
const raw = await fetch('/__earth_qa_catalog.json').then(response => response.json());
const catalog = createSatelliteCatalog(raw.orbital, raw.catalog, raw.metadata);
const client = new QueryClient({ defaultOptions: { queries: { retry: false } } });
client.setQueryData(['satellites', 'celestrak', 'active'], catalog);
await i18n.changeLanguage(params.get('locale') || 'en');
usePreferencesStore.setState({ reduceMotion: true, graphicsQuality: 'high', earthLayerDrawerOpen: false });
const initialize = CesiumEarthEngine.prototype.initialize;
CesiumEarthEngine.prototype.initialize = async function () {
  await initialize.call(this);
  window.qa.engine = this;
  // Exercise the high-profile shader even on CI software renderers. GPU identity
  // is retained in the report; this is not an assertion about native FPS.
  if (params.get('quality') === 'high') this.applyQuality('high');
};
const root = createRoot(document.getElementById('root'));
const render = (active) => root.render(React.createElement(QueryClientProvider, { client }, React.createElement(EarthViewport, { active })));
window.qa = {
  catalog, active: render, unmount: () => root.unmount(),
  refreshCatalog: () => client.setQueryData(['satellites', 'celestrak', 'active'], {...catalog, fetchedAt: new Date().toISOString()}),
  locale: (locale) => i18n.changeLanguage(locale),
  select: (id) => useSatelliteSelectionStore.getState().requestSatellite(id),
  satelliteLayer: () => window.qa.engine.layerRegistry.layers.get('live-satellites'),
  motion: (enabled) => usePreferencesStore.getState().setReduceMotion(!enabled),
  clockTime: () => JulianDate.toDate(window.qa.engine.widget.clock.currentTime).getTime(),
  project: () => SceneTransforms.worldToWindowCoordinates(window.qa.engine.widget.scene, new Cartesian3(1, 1, 1)),
};
render(true);
</script>
<style>html,body,#root{width:100%;height:100%;margin:0} .earth-viewport{position:absolute;inset:0;width:100%;height:100%}</style>
</body></html>
