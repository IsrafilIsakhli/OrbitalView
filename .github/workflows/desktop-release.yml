name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  PNPM_VERSION: "11.20.0"
  WIKIMEDIA_CONTACT: ${{ vars.WIKIMEDIA_CONTACT }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.channel.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-source-secrets.mjs
      - id: channel
        run: node --input-type=module -e 'import {releaseRepository} from "./scripts/release-channel.mjs"; console.log("repository=" + releaseRepository)' >> "$GITHUB_OUTPUT"
      - id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "$VERSION" = "$TAURI_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          node scripts/validate-update-policy.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Verify Wikimedia API contact
        run: test -n "$WIKIMEDIA_CONTACT"

  native-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            services/translation-gateway -> target
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf pkg-config
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked
      - run: cargo test --manifest-path services/translation-gateway/Cargo.toml --locked

  windows:
    needs: [verify, native-quality]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [nsis, msi]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    outputs:
      trust: ${{ steps.windows-signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Import Windows signing certificate
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No Windows certificate configured; producing an unsigned installer and recording that state in the website manifest."
            "mode=unsigned" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $bytes,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
          )
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("My", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($certificate)
          $store.Close()
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "mode=authenticode" >> $env:GITHUB_OUTPUT
      - name: Build Windows installers
        env:
          ORBITAL_PACKAGE_KIND: ${{ matrix.bundle }}
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-updater-config.json"
          node scripts/create-tauri-updater-config.mjs $configPath
          pnpm tauri build --bundles ${{ matrix.bundle }} --config $configPath
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.bundle }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  macos:
    needs: [verify, native-quality]
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    outputs:
      trust: ${{ steps.apple-signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Prepare Apple signing and notarization
        id: apple-signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_BASE64" ]]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          else
            echo "Apple credentials are incomplete; producing an ad-hoc signed universal DMG."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_BASE64" ]]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          fi
      - name: Build macOS application, DMG and updater
        env:
          ORBITAL_PACKAGE_KIND: dmg
        shell: bash
        run: |
          CONFIG_PATH="$RUNNER_TEMP/tauri-updater-config.json"
          node scripts/create-tauri-updater-config.mjs "$CONFIG_PATH"
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config "$CONFIG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  linux:
    needs: [verify, native-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, artifact: linux-x64, bundle: appimage }
          - { runner: ubuntu-22.04, artifact: linux-x64, bundle: deb }
          - { runner: ubuntu-22.04, artifact: linux-x64, bundle: rpm }
          - { runner: ubuntu-22.04-arm, artifact: linux-arm64, bundle: appimage }
          - { runner: ubuntu-22.04-arm, artifact: linux-arm64, bundle: deb }
          - { runner: ubuntu-22.04-arm, artifact: linux-arm64, bundle: rpm }
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf pkg-config rpm xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Build Linux packages and updater
        env:
          ORBITAL_PACKAGE_KIND: ${{ matrix.bundle }}
        shell: bash
        run: |
          CONFIG_PATH="$RUNNER_TEMP/tauri-updater-config.json"
          node scripts/create-tauri-updater-config.mjs "$CONFIG_PATH"
          pnpm tauri build --bundles ${{ matrix.bundle }} --config "$CONFIG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.bundle }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  publish:
    if: ${{ github.ref_type == 'tag' }}
    needs: [verify, windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generate website manifest and checksums
        env:
          RELEASE_WINDOWS_TRUST: ${{ needs.windows.outputs.trust }}
          RELEASE_MACOS_TRUST: ${{ needs.macos.outputs.trust }}
        run: node scripts/create-release-manifest.mjs release-assets "${{ needs.verify.outputs.version }}" "${{ needs.verify.outputs.repository }}" "${{ github.ref_name }}"
      - name: Generate signed cross-platform updater manifest
        run: node scripts/create-updater-manifest.mjs release-assets "${{ needs.verify.outputs.version }}" "${{ needs.verify.outputs.repository }}" "${{ github.ref_name }}" release/update-policy.json
      - name: Verify complete public artifacts
        run: node scripts/verify-release-artifacts.mjs release-assets/publish
      - name: Create draft in binary-only public repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "${{ github.ref_name }}" release-assets/publish/* --repo "${{ needs.verify.outputs.repository }}" --draft --title "Orbital Vision ${{ needs.verify.outputs.version }}" --notes "Release candidate. Publication requires completed native tester and performance gates."
