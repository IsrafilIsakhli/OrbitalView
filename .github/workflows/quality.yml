name: Production quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm production:check

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WIKIMEDIA_CONTACT: ${{ vars.WIKIMEDIA_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            services/translation-gateway -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path services/translation-gateway/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked
      - run: cargo test --manifest-path services/translation-gateway/Cargo.toml --locked

  native-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install pinned audit tool
        run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file services/translation-gateway/Cargo.lock
